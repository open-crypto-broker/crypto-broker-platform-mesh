apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-syncagent-crypto-broker
rules:
  - apiGroups: ["open-crypto-broker.io"]
    resources: ["cryptobrokers", "cryptobrokers/status"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-syncagent-crypto-broker
subjects:
  - kind: ServiceAccount
    name: api-syncagent
    namespace: crypto-broker-provider
roleRef:
  kind: ClusterRole
  name: api-syncagent-crypto-broker
  apiGroup: rbac.authorization.k8s.io
