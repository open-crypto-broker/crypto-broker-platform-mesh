# Default profile – broad demo; not tied to a single external standard.
# Showcases widest hash (sha3-512) and high-strength hash/sign combo.
---
Settings:
  CryptoLibrary: native

Profiles:
  - Name: Default
    API:
      HashData:
        HashAlg: sha3-512
      SignCertificate:
        SignAlg: ecdsa
        HashAlg: sha-512
        Validity:
          ValidNotBeforeOffset: -1h
          ValidNotAfterOffset: 8760h
        KeyConstraints:
          Subject:
            RSA:
              MinKeySize: 2048
              MaxKeySize: 4096
            ECDSA:
              MinKeySize: 256
              MaxKeySize: 521
          Issuer:
            ECDSA:
              MinKeySize: 384
              MaxKeySize: 521
        KeyUsage: [digitalSignature, keyEncipherment]
        ExtendedKeyUsage: [clientAuth]
        BasicConstraints:
          CA: false
